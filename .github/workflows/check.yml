name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Disponibilizar Pandoc
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import pypandoc
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(Path(pypandoc.get_pandoc_path()).parent) + "\n")
          PYCODE
      - run: pandoc --version
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
