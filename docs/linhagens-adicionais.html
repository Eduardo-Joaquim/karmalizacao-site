<h3 id="personagens-de-outras-linhagens">Personagens de outras linhagens</h3>
<p>Para criar nova raça, escolha uma capacidade de ambiente, uma capacidade ativa limitada a uma vez por cena e uma vulnerabilidade significativa. Se um traço imita uma técnica de Grau II ou maior, ele precisa de custo, condição ou recarga equivalente.</p>
